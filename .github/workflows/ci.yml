name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Runs from the repo without installing
        run: |
          python -m cantrip --version
          python -m cantrip cast attendees-to-leads --csv examples/luma-guests.csv \
            --profile examples/profiles/devtool-startup.toml --out /tmp/no-install.csv
          test -s /tmp/no-install.csv
      - name: install.sh adds a working cantrip command
        run: |
          CANTRIP_BIN_DIR=/tmp/cbin sh install.sh
          cd /tmp && /tmp/cbin/cantrip --version
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - name: Installed copy works outside the repo
        run: |
          python -m venv /tmp/installed && /tmp/installed/bin/pip install .
          cd /tmp && /tmp/installed/bin/cantrip cast attendees-to-leads \
            --csv "$GITHUB_WORKSPACE/examples/luma-guests.csv" \
            --profile "$GITHUB_WORKSPACE/examples/profiles/devtool-startup.toml" --out /tmp/leads.csv
          test -s /tmp/leads.csv
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cantrip .
      - name: Refuses to start without a password
        run: "! docker run --rm cantrip"
      - name: Runs with one, asks for it, and keeps the profile in /data
        run: |
          docker run -d --name c -p 8765:8765 -e CANTRIP_PASSWORD='correct horse battery' cantrip
          for i in $(seq 30); do curl -sf localhost:8765/healthz && break; sleep 1; done
          test "$(curl -s -o /dev/null -w '%{http_code}' localhost:8765/)" = 401
          test "$(curl -s -o /dev/null -w '%{http_code}' -u me:'correct horse battery' localhost:8765/)" = 200
          curl -sf -u me:'correct horse battery' -H 'Content-Type: application/json' \
            -d '{"name":"X","pitch":"y","buyer_roles":"cto"}' localhost:8765/api/profile
          docker exec c test -s /data/cantrip.toml
          test "$(docker inspect -f '{{.Config.User}}' c)" = cantrip
