[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cantrip"
version = "0.1.0"
description = "Go-to-market, cast at will: open-source spells that turn developer signals into scored leads and drafted outreach."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = []
classifiers = [
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
cantrip = "cantrip.cli:main"

[project.urls]
Homepage = "https://github.com/cantrip-dev/cantrip"

[tool.setuptools.packages.find]
include = ["cantrip*"]
