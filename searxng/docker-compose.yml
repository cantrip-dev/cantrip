# Free, self-hosted web search for Cantrip. Start it with:
#   cd searxng && python3 -c "import secrets; print('SEARXNG_SECRET=' + secrets.token_hex(32))" > .env && docker compose up -d
# then use CANTRIP_SEARCH=searxng and CANTRIP_SEARCH_URL=http://localhost:8888

name: cantrip-searxng

services:
  searxng:
    image: docker.io/searxng/searxng:latest
    restart: unless-stopped
    ports:
      - "127.0.0.1:8888:8080"   # only this computer can reach it
    env_file: ./.env
    volumes:
      - ./config/:/etc/searxng/
