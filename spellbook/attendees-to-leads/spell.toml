# attendees-to-leads: an event guest list (name, email, company, job title,
# LinkedIn...) sorted into the people most worth following up with, each with
# a drafted note. Works with a Luma export or any registration CSV.
#
# What you sell and who you sell to come from your profile (cantrip.toml,
# made by `cantrip init`). This file only holds how the spell scores and writes.

event_name = ""      # or pass --event "Your Event Name"

[icp]
# Seniority ladder, read from job titles and bios. The highest matching level counts.
# Your profile's `seniority` setting scales these points (high, normal, low, ignore).
[[icp.seniority]]
points = 30
words = ["founder", "co-founder", "cofounder", "ceo", "cto", "cmo", "chief", "owner", "president"]
[[icp.seniority]]
points = 25
words = ["vp", "vice president", "head of", "director", "general manager", "gm"]
[[icp.seniority]]
points = 15
words = ["lead", "principal", "staff", "manager"]
[[icp.seniority]]
points = 5
words = ["senior", "sr"]

[icp.weights]
has_company = 10
target_company = 35
keyword = 10
attended = 10            # checked in (Luma's checked_in_at column), not just registered
work_email = 10
reachable = 5            # a personal email or a LinkedIn URL
deprioritize = -25

[icp.tiers]
hot = 60
warm = 35

# Templates per tier. Fields: {first_name} {company} {title} {event} {signal} {reason}
# {product} {pitch} {product_line} ("product, pitch") {ask} {sender}. Override any of them
# in your profile under [templates].
[templates]
hot = """
Hi {first_name},

Thanks for being part of {event}. I'm reaching out about {product_line}, which I think could be a fit for {company}.

Would you be open to {ask}?

{sender}
"""
warm = """
Hi {first_name},

Thanks for being part of {event}! I wanted to share {product_line}, in case it's useful for {company}. Happy to tell you more.

{sender}
"""
default = """
Hi {first_name}, thanks for being part of {event}! Hope to see you at the next one.

{sender}
"""
