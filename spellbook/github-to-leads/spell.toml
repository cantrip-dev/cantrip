# github-to-leads: find developers by their GitHub profile (a search, a list of
# logins, a repo's contributors or stargazers), score them against your ICP,
# and draft a first note.
#
# What you sell and who you sell to come from your profile (cantrip.toml,
# made by `cantrip init`). This file only holds how the spell scores and writes.

[icp]
influencer_followers = 500  # followers that count as influence

# Seniority ladder, read from job titles and bios. The highest matching level counts.
# Your profile's `seniority` setting scales these points (high, normal, low, ignore).
[[icp.seniority]]
points = 30
words = ["founder", "co-founder", "cofounder", "ceo", "cto", "cmo", "chief", "owner", "president"]
[[icp.seniority]]
points = 25
words = ["vp", "vice president", "head of", "director", "general manager", "gm"]
[[icp.seniority]]
points = 15
words = ["lead", "principal", "staff", "manager"]
[[icp.seniority]]
points = 5
words = ["senior", "sr"]

[icp.weights]
has_company = 10
target_company = 35
keyword = 15
language = 10            # one of their most-used languages is in your list
influence = 15           # at least influencer_followers followers
contributed = 10         # committed to the repo you read
work_email = 10
reachable = 5            # public email, website or blog on the profile
deprioritize = -20

[icp.tiers]
hot = 60
warm = 30

# Templates per tier. Fields: {first_name} {company} {title} {event} {signal} {reason}
# {product} {pitch} {product_line} ("product, pitch") {ask} {sender}. Override any of them
# in your profile under [templates].
[templates]
hot = """
Hi {first_name},

I came across your GitHub: you {signal}. I'm reaching out about {product_line}, which I think could be useful to you and {company}.

Would you be open to {ask}?

{sender}
"""
warm = """
Hi {first_name},

I came across your GitHub and liked what you're building. I wanted to share {product_line}, and I'd love to hear whether it's useful to you.

{sender}
"""
default = """
Hi {first_name}, I wanted to share {product_line}. If it sounds useful, I'd love your feedback.

{sender}
"""
