# stargazers-to-leads: people who starred your repo or came to your event,
# scored against who you sell to, each with a drafted first note.
# Copy this file and edit it for your own product.

product = "Cantrip"
sender = ""          # your first name, used to sign the drafts
ask = "Would you be up for a 15-minute call to tell me what you'd want it to do?"
event_name = ""      # used for CSV sources, e.g. "Open Source AI Day"

[icp]
# Whole words or phrases, matched case-insensitively.
target_companies = []    # e.g. ["Databricks", "Snowflake", "Redis"]
roles = ["founder", "cto", "head of", "devrel", "developer relations", "developer advocate", "growth", "gtm", "marketing", "vp"]
keywords = ["devtool", "developer tools", "open source", "open-source", "ai", "llm", "agent", "infra", "api", "sdk"]
languages = ["Python", "TypeScript", "Go", "Rust"]
exclude = []             # companies or email domains to skip, e.g. ["competitor.com"]
influencer_followers = 500

[icp.weights]
has_company = 10
target_company = 40
role = 25
keyword = 15
language = 10
influence = 15
reachable = 5

[icp.tiers]
hot = 60
warm = 30

# Templates per tier. Fields: {first_name} {company} {signal} {reason} {sender} {product} {ask}
[templates]
hot = """
Hi {first_name},

Thanks for the interest: I saw you {signal}. I'm building {product} and talking to people at teams like {company} who run go-to-market for developer products.

{ask}

{sender}
"""
warm = """
Hi {first_name},

I saw you {signal}, thank you. I'm building {product} in the open and would love to hear what you'd use it for.

{ask}

{sender}
"""
default = """
Hi {first_name}, thanks for the interest in {product}! If there's something you'd want it to do, I'd love to hear it.

{sender}
"""
